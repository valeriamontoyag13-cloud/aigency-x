<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ▼ CLIENTE: título -->
<title>Demo · AIgency.X</title>
<meta name="description" content="Demo interactiva preparada por AIgency.X: así acompañaría el asistente con IA y las automatizaciones a los clientes de un negocio de citas.">
<meta name="robots" content="noindex">
<!-- ▼ CLIENTE: fuentes (las de la web del cliente; si no hay, ver references/marca-y-lenguaje.md) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ▼ CLIENTE: identidad visual. Solo se cambian estos tokens. */
  :root{
    --bg:#ffffff;          /* fondo de la página (claro) */
    --soft:#ede7ff;        /* superficies suaves, números de momentos */
    --accent:#7c4dff;      /* acento de la marca */
    --dark:#1b1730;        /* color oscuro de la marca: títulos, botón activo, cierre */
    --dark-2:#0f0c1f;      /* segundo oscuro para degradados */
    --text:#1b1730;
    --muted:#5b5770;
    --line:#e6e1f5;
    --font-titulo:'Plus Jakarta Sans',system-ui,sans-serif;
    --font-texto:'Inter',system-ui,sans-serif;
  }
  /* ▲ fin identidad visual. Lo de abajo es el motor: no hace falta tocarlo. */
  :root{ --wa-bg:#efeae2; --wa-out:#d9fdd3; --wa-in:#ffffff; --wa-head:#f0f2f5; --wa-green:#00a884; --wa-blue:#027eb5; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-texto);font-size:15px;line-height:1.55}
  h1,h2,h3{font-family:var(--font-titulo);font-weight:500;color:var(--dark);letter-spacing:-.01em}
  button{font:inherit;cursor:pointer}

  .top{max-width:1180px;margin:0 auto;padding:28px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .duo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .duo b{color:var(--dark);font-weight:600}
  .badge{font-size:12px;background:var(--soft);color:var(--muted);padding:5px 12px;border-radius:99px}

  .hero{max-width:1180px;margin:0 auto;padding:36px 24px 28px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
  .hero h1{font-size:44px;line-height:1.1;max-width:760px}
  .hero h1 em{color:var(--accent)}
  .hero p{color:var(--muted);max-width:640px;margin-top:14px;font-size:16.5px}
  /* "Cómo usarla": una línea para quien no está acostumbrado a demos (CONFIG.textos.ayuda) */
  .hero p.ayuda{display:inline-flex;gap:10px;align-items:flex-start;margin-top:18px;max-width:720px;font-size:14.5px;line-height:1.5;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
  .hero p.ayuda[hidden]{display:none}
  .solo-movil{display:none}
  @media(max-width:920px){ .solo-movil{display:inline} .solo-escritorio{display:none} }

  .stage{max-width:1180px;margin:0 auto;padding:8px 24px 48px;display:grid;grid-template-columns:1fr 400px;gap:40px;align-items:start}
  .stage > *{min-width:0}   /* sin esto, los chips del chat ensanchan la columna en celulares de 375 px */

  .momentos{display:grid;gap:10px}
  .momento{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;color:var(--text);transition:border-color .2s,box-shadow .2s,transform .2s}
  .momento:hover{border-color:var(--accent);transform:translateY(-1px)}
  .momento.on{border-color:var(--dark);box-shadow:0 18px 40px -26px color-mix(in srgb,var(--dark) 60%,transparent)}
  .momento .n{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--dark);display:flex;align-items:center;justify-content:center;font-family:var(--font-titulo);font-size:17px}
  .momento.on .n{background:linear-gradient(135deg,var(--accent),var(--dark));color:#fff}
  .momento h3{font-size:17.5px;line-height:1.25}
  .momento p{font-size:13.5px;color:var(--muted);margin-top:3px}
  .momento .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:6px}

  .lado{position:sticky;top:18px}
  .phone{width:100%;max-width:380px;margin:0 auto;height:720px;background:#111;border-radius:46px;padding:12px;box-shadow:0 40px 80px -40px color-mix(in srgb,var(--dark-2) 70%,transparent)}
  .screen{height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;background:var(--wa-bg);color:#111b21}   /* color propio: en temas oscuros, el texto claro de la página no debe entrar al celular */
  .bar{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--wa-head);border-bottom:1px solid rgba(0,0,0,.06)}
  .bar .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--dark));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-titulo);font-size:15px;flex:0 0 38px;overflow:hidden}
  .bar .av img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
  .bar .who{flex:1;min-width:0}
  .bar .who b{display:block;font-size:14.5px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .who span{font-size:12px;color:#667781}
  .bar .ch{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:#e7f8f2;color:#0b7a5f}
  .bar.ig{background:#fff}
  .bar.ig .ch{background:#fdeef5;color:#c13584}

  .chat{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;
    background-color:var(--wa-bg);background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px}
  .chat.ig{background:#fff;background-image:none}
  .dia{align-self:center;font-size:11.5px;background:#fff;color:#54656f;padding:4px 10px;border-radius:8px;margin:4px 0 6px;box-shadow:0 1px .5px rgba(0,0,0,.08)}
  .msg{max-width:84%;padding:7px 10px 6px;border-radius:10px;font-size:14px;line-height:1.42;color:#111b21;box-shadow:0 1px .5px rgba(0,0,0,.1);position:relative;animation:pop .22s ease-out;white-space:pre-line;word-wrap:break-word}
  .msg.in{align-self:flex-start;background:var(--wa-in);border-top-left-radius:2px}
  .msg.out{align-self:flex-end;background:var(--wa-out);border-top-right-radius:2px}
  .msg .h{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
  .msg.out .h::after{content:" ✓✓";color:#53bdeb}
  .msg.sys{align-self:center;background:#fff7e0;color:#6b5a1e;font-size:12.5px;max-width:92%;text-align:center;box-shadow:none;border:1px solid #f1e2b0}
  .chat.ig .msg.in{background:#efefef;box-shadow:none;border-radius:18px}
  .chat.ig .msg.out{background:#3797f0;color:#fff;box-shadow:none;border-radius:18px}
  .chat.ig .msg .h{display:none}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

  .botones{display:grid;gap:4px;align-self:flex-start;width:84%;margin-top:-2px;animation:pop .22s ease-out}
  .botones button{background:#fff;border:0;border-radius:8px;padding:9px;color:var(--wa-blue);font-weight:500;font-size:14px;box-shadow:0 1px .5px rgba(0,0,0,.1)}
  .botones button:disabled{color:#9aa5ab;cursor:default}
  .botones button.elegido{background:#e9f5fb}

  .seguir{align-self:center;margin:8px 0 4px;animation:pop .22s ease-out}
  .seguir button{background:var(--dark);color:#fff;border:0;border-radius:99px;padding:9px 18px;font-size:13px;font-weight:500;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:latido 1.8s ease-in-out .6s infinite}
  .sugeridas button.toca{border-color:var(--wa-green);color:#0b6b4a;font-weight:500;animation:latido 1.8s ease-in-out .6s infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .typing{align-self:flex-start;background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:4px;box-shadow:0 1px .5px rgba(0,0,0,.1)}
  .typing i{width:6px;height:6px;border-radius:50%;background:#8696a0;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .recibo{background:#fff!important;border-radius:10px;padding:12px;width:200px;font-size:12.5px;color:#333;border:1px solid #eee}
  .recibo .ok{color:#7b2cbf;font-weight:700;font-size:13px;margin-bottom:6px}
  .recibo .m{font-size:20px;font-weight:700;color:#111;margin:4px 0}
  .recibo div{display:flex;justify-content:space-between;gap:8px}

  .post{border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff;flex:0 0 auto}
  .post .img{height:170px;background:linear-gradient(160deg,var(--soft),var(--accent) 60%,var(--dark));display:flex;align-items:flex-end;padding:14px;color:#fff;font-family:var(--font-titulo);font-size:20px;line-height:1.15}
  .post .cap{padding:10px 12px;font-size:13px;color:#262626}
  .coment{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:6px 2px;animation:pop .22s ease-out}
  .coment .a{width:28px;height:28px;border-radius:50%;flex:0 0 28px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600}
  .coment.resp{margin-left:30px}
  .coment .a.marca{background:linear-gradient(135deg,var(--accent),var(--dark))}

  .sugeridas{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;background:var(--wa-bg);scrollbar-width:none}
  .sugeridas::-webkit-scrollbar{display:none}
  .sugeridas button{flex:0 0 auto;background:#fff;border:1px solid #d1d7db;border-radius:99px;padding:6px 12px;font-size:12.5px;color:#111b21}
  .entrada{display:flex;gap:8px;padding:8px 10px 12px;background:var(--wa-bg)}
  .entrada input{flex:1;border:0;border-radius:22px;padding:11px 16px;font:inherit;font-size:14.5px;background:#fff;outline:none;min-width:0}
  .entrada input:disabled{background:#f5f5f5}
  .entrada button{width:44px;height:44px;border-radius:50%;border:0;background:var(--wa-green);color:#fff;font-size:18px;flex:0 0 44px}
  .entrada button:disabled{background:#b9c3c8}

  .detras{max-width:380px;margin:16px auto 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
  .detras .kicker{margin-bottom:4px}
  .detras p{font-size:13.5px;color:var(--muted)}
  .detras .repetir{margin-top:10px;background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;color:var(--dark)}

  .cierre{max-width:1180px;margin:0 auto;padding:0 24px 56px}
  .cierre .caja{background:linear-gradient(135deg,var(--dark),var(--dark-2));color:#fff;border-radius:28px;padding:34px;display:flex;gap:24px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .cierre h2{color:#fff;font-size:28px}
  .cierre p{color:rgba(255,255,255,.75);margin-top:6px;max-width:620px}
  .cierre a{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent));color:var(--dark-2);text-decoration:none;font-weight:600;padding:13px 22px;border-radius:99px;white-space:nowrap}
  .pie{text-align:center;font-size:12px;color:var(--muted);padding:0 24px 28px}

  /* Modo tienda: fichas de producto, resumen de pedido, documento y foto */
  .prods{display:flex;gap:8px;overflow-x:auto;align-self:stretch;flex:0 0 auto;padding:2px 2px 6px;scrollbar-width:none;animation:pop .22s ease-out}
  .prods::-webkit-scrollbar{display:none}
  .prod{flex:0 0 146px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px .5px rgba(0,0,0,.12);display:flex;flex-direction:column}
  .prods.una .prod{flex-basis:200px}
  .prod img,.prod .ph{width:100%;height:178px;object-fit:cover;object-position:center 18%;background:var(--soft);display:block}
  .prods.una .prod img,.prods.una .prod .ph{height:230px}
  .prod .ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-family:var(--font-titulo);color:var(--dark)}
  .prod .i{padding:7px 9px 9px;display:flex;flex-direction:column;gap:1px;font-size:11.5px;color:#54656f;line-height:1.35}
  .prod .i b{font-size:12.5px;color:#111b21}
  .prod .i .p{font-weight:600;color:#111b21;font-size:12.5px}
  .msg.pedido{width:84%;white-space:normal}
  .pedido .tit{font-weight:600;margin-bottom:6px}
  .pedido .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
  .pedido .l small{display:block;color:#667781;font-size:11.5px}
  .pedido .tot{border-top:1px dashed #d1d7db;margin-top:6px;padding-top:6px;font-weight:700;display:flex;justify-content:space-between}
  .pedido .l > span:last-child,.pedido .tot span:last-child{white-space:nowrap}
  .pedido .pie{font-size:12px;color:#54656f;margin-top:4px;text-align:left;padding:0}   /* .pie también es el pie de página: se anula su centrado */
  .msg.doc{display:flex;gap:10px;align-items:center;white-space:normal;flex-wrap:wrap;min-width:220px}
  .doc .ic{width:34px;height:40px;border-radius:4px;background:#e2513f;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
  .doc .tx{flex:1;min-width:0}
  .doc small{display:block;color:#667781;font-size:11.5px}
  .doc .h{flex-basis:100%}
  .msg.foto{padding:3px;width:62%;white-space:normal}
  .foto img{width:100%;border-radius:8px;display:block;height:230px;object-fit:cover;object-position:center 18%}
  .foto .cap{display:block;padding:4px 6px 0}

  @media(max-width:920px){
    .stage{grid-template-columns:1fr;gap:18px}
    .lado{position:static;order:2}
    .momentos{order:1;display:flex;overflow-x:auto;gap:10px;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
    .momentos::-webkit-scrollbar{display:none}
    .momento{flex:0 0 230px;scroll-snap-align:start;padding:12px 14px;align-items:center}
    .momento p{display:none}
    .momento h3{font-size:16px}
    .momento .tag{margin-top:2px}
    .hero h1{font-size:32px}
  }
  @media(max-width:480px){
    .top,.hero,.stage,.cierre{padding-left:16px;padding-right:16px}
    .phone{height:640px;border-radius:38px;padding:8px}
    .screen{border-radius:31px}
    .momento{flex-basis:210px}
    .cierre .caja{padding:26px 20px}
  }

  /* ▼ WEB: va dentro de la tarjeta de la sección "Pruébalo con tu negocio". Sin encabezado ni cierre propios. */
  html,body{background:#ffffff}
  .top,.hero,.cierre,.pie{display:none}
  h1,h2,h3{font-weight:600;letter-spacing:-.015em}
  .stage{max-width:none;padding:20px 24px 24px;gap:28px}
  @media(min-width:921px){ .stage{grid-template-columns:minmax(0,1fr) 380px} }
  /* Entre 761 y 920 px (tablet, o la tarjeta en un notebook chico): momentos en columna y el celular al lado. */
  @media(min-width:761px) and (max-width:920px){
    .stage{grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:16px 16px 20px}
    .lado{order:0;position:static} .momentos{order:0;display:grid;overflow:visible;padding-bottom:0}
    .momento{flex:none;padding:14px 16px;align-items:start} .momento p{display:block}
    .solo-movil{display:none} .solo-escritorio{display:inline}
  }
  .momento{border-radius:20px;border-color:#e6e1f5;box-shadow:0 0 0 1px rgba(27,23,48,.02)}
  .momento:hover{border-color:#b9a3ff}
  .momento.on{border-color:#7c4dff;box-shadow:0 12px 30px -16px rgba(124,77,255,.55)}
  .momento .n{font-weight:600;background:#f4f3f7}
  .momento.on .n{background:#7c4dff}
  .momento .tag{color:#7c4dff}
  .phone{box-shadow:0 0 0 1px rgba(27,23,48,.05),0 30px 60px -30px rgba(124,77,255,.55)}
  .bar .av{background:linear-gradient(135deg,#a57bff,#7c4dff)}
  .seguir button{background:#7c4dff}
  .detras{border-radius:20px;background:#fafafb;border-color:#e6e1f5}
  .detras .kicker{color:#7c4dff}
  @media(max-width:920px){ .stage{padding:16px 0 8px} }
  @media(max-width:480px){ .stage{padding-left:0;padding-right:0} }
</style>
</head>
<body>

<header class="top">
  <div class="duo"><b id="duoCliente"></b> × <b id="duoAgencia"></b></div>
  <span class="badge">Demo interactiva · datos de ejemplo</span>
</header>

<section class="hero">
  <p class="kicker" id="heroKicker"></p>
  <h1 id="heroTitulo"></h1>
  <p id="heroBajada"></p>
  <p class="ayuda" id="heroAyuda" hidden></p>
</section>

<main class="stage">
  <nav class="momentos" id="momentos" aria-label="Momentos de la demo"></nav>
  <aside class="lado">
    <div class="phone" aria-label="Vista previa del celular">
      <div class="screen">
        <div class="bar" id="bar">
          <div class="av" id="av"></div>
          <div class="who"><b id="who"></b><span id="estado">en línea</span></div>
          <span class="ch" id="canal">WhatsApp</span>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="sugeridas" id="sugeridas"></div>
        <form class="entrada" id="entrada" autocomplete="off">
          <input id="texto" aria-label="Mensaje">
          <button id="enviar" aria-label="Enviar">➤</button>
        </form>
      </div>
    </div>
    <div class="detras">
      <p class="kicker">Lo que pasa detrás</p>
      <p id="detras"></p>
      <button class="repetir" id="repetir" type="button">↻ Repetir este momento</button>
    </div>
  </aside>
</main>

<section class="cierre">
  <div class="caja">
    <div><h2 id="cierreTitulo"></h2><p id="cierreTexto"></p></div>
    <a id="cierreCta" target="_blank" rel="noopener"></a>
  </div>
</section>
<p class="pie" id="pie"></p>

<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  CONFIG DEL CLIENTE — todo lo que cambia de un negocio a otro.       ║
   ║  El contenido de abajo es un EJEMPLO genérico: se reemplaza entero.  ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
/* Momentos compartidos de la demo por rubro (plan cliente fundador).
   Solo muestran lo que el motor real (recepcionista-barberias) ya hace:
   agenda en el calendario, abono que confirma el dueño con Recibido / No llegó, liberación automática
   si no paga, lista de espera, recordatorios de 24 h y 2 h, pausa de 12 h cuando el dueño contesta
   desde su app y resumen de la mañana. V trae el vocabulario y los datos de cada rubro.
   Opcional, para negocios que van a domicilio: V.lugar (línea del lugar en la reserva; por defecto '📍 dirección')
   y V.recordatorio2(R2) (el aviso de 2 horas antes). */
function momentosCitas(V){
  const N = CONFIG.marca.nombre, D = CONFIG.marca.duena, DIR = CONFIG.reserva.direccion;
  const toca = () => sistema('👇 Toca el mensaje de abajo para escribir como '+V.cliente+'.');
  const resumenCab = () => cabecera({nombre:'Asistente · '+N, estado:'solo para '+D, logo:false, iniciales:'AX'});
  const recibo = (monto) => nodo('<div class="ok">Transferencia · Envío exitoso</div><div class="m">'+$$(monto).replace(CONFIG.moneda.sufijo,'')+'</div><div><span>Para</span><span>'+esc(N)+'</span></div><div><span>Fecha</span><span>Hoy</span></div><div><span>Comprobante</span><span>N.º 48213907</span></div>', 'msg out recibo');
  return [
    {
      hora: 22*60+47, t:'Conversa con tu asistente', s:V.m1s, tag:'Pruébalo tú',
      detras:'El asistente conoce tus servicios, precios, horarios y equipo. Responde al instante, recomienda, agenda en el calendario de cada '+V.prof+' y te pasa a ti los reclamos o lo que no sabe. No inventa: si no sabe algo, te lo pregunta.',
      run: t => iniciarAsistente(t),
    },
    {
      hora: 23*60+40, t:'Te escriben a las 11:40 de la noche', s:'Mientras duermes, '+V.laCliente+' queda con hora y tú no tocaste el celular.', tag:'Mientras duermes',

let token = 0;           // cambia al cambiar de momento: corta la escena anterior
let hora = 9*60;         // reloj ficticio de la conversación
class Cortado extends Error {}

const esperar = (ms, t) => new Promise((ok, no) => setTimeout(() => t===token ? ok() : no(new Cortado()), ms));
const hhmm = () => { hora += 1; const h = Math.floor(hora/60)%24, m = hora%60; return (h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' a. m.':' p. m.'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/_([^_\n]+)_/g,'<i>$1</i>');
function bajar(){ chat.scrollTop = chat.scrollHeight; }
function nodo(html, cls){ const d = document.createElement('div'); d.className = cls; d.innerHTML = html; chat.appendChild(d); bajar(); return d; }
function burbuja(texto, lado){ return nodo(fmt(texto)+'<span class="h">'+hhmm()+'</span>', 'msg '+lado); }
function sistema(texto){ return nodo(fmt(texto), 'msg sys'); }
function dia(texto, h){ if (h !== undefined) hora = h - 1; return nodo(esc(texto), 'dia'); }
function limpiar(){ chat.innerHTML = ''; }

async function escribe(texto, t, pausa){
  const ty = nodo('<i></i><i></i><i></i>', 'typing');
  try { await esperar(pausa ?? Math.min(1700, 450 + texto.length*9), t); } finally { ty.remove(); }
  return burbuja(texto, 'in');
}
// Escenas guiadas: NADA avanza solo. Cada paso espera a que la persona toque algo
// (un botón "continuar", un botón de plantilla o el mensaje sugerido del cliente).
function continuar(texto, t){
  return new Promise((ok, no) => {
    const d = nodo('', 'seguir');
    const b = document.createElement('button'); b.type = 'button'; b.textContent = texto;
    b.onclick = () => { d.remove(); t===token ? ok() : no(new Cortado()); };
    d.appendChild(b); bajar();
  });
}
// Mensaje del cliente: aparece como sugerencia y se envía cuando la persona la toca.
// burbujaPropia=false si la escena dibuja su propio mensaje (por ejemplo, el comprobante).
function clienta(texto, t, burbujaPropia=true){
  return new Promise((ok, no) => {
    sug.innerHTML = '';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'toca'; b.textContent = texto;
    b.onclick = () => {
      sugerencias([]); input.placeholder = 'Toca los botones para avanzar';
      if (t!==token) return no(new Cortado());
      if (burbujaPropia) burbuja(texto, 'out');
      ok();
    };
    sug.appendChild(b); sug.style.display = 'flex';
    input.placeholder = 'Toca el mensaje sugerido para enviarlo';
  });
}

function botones(opciones, t){
  // Botones de plantilla de WhatsApp: la escena sigue cuando la persona elige uno.
  return new Promise((ok, no) => {
    const wrap = nodo('', 'botones');
    let listo = false;
    const elegir = i => {
      if (listo) return; listo = true;
      [...wrap.children].forEach((b,j) => { b.disabled = true; if (i===j) b.classList.add('elegido'); });
      if (t!==token) return no(new Cortado());
      burbuja(opciones[i], 'out'); ok(i);
    };
    opciones.forEach((o,i) => { const b = document.createElement('button'); b.type='button'; b.textContent = o; b.onclick = () => elegir(i); wrap.appendChild(b); });
    bajar();
  });
}

function sugerencias(lista){
  sug.innerHTML = '';
  lista.forEach(s => { const b = document.createElement('button'); b.type='button'; b.textContent = s; b.onclick = () => enviarLibre(s); sug.appendChild(b); });
  sug.style.display = lista.length ? 'flex' : 'none';
}

/* ----- Asistente local (momento 1) ----- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const nuevoCtx = () => ({ sugerida:null, reservando:false, abono:null, opciones:null, chips:null, primera:true, slots:null, paso:null, nombre:null, pendiente:null, talla:null, color:null, carrito:[], tallaPref:{}, guia:null, nPedido:(CONFIG.tienda && CONFIG.tienda.primerPedido) || 1001,

function ficha(k){

}
function recomendar(claves, intro){
  ctx.sugerida = claves[0];
  if (claves.length > 1) {
    // Varias opciones: el cliente elige cuál (chips con cada nombre; también se reconoce si lo escribe)
    ctx.opciones = claves; ctx.chips = claves.map(k => CAT[k].n);

  }

}

/* Reconoce un servicio por las palabras propias de su nombre ("levantamiento y tonificacion" → Glúteos).
   Solo cuentan las palabras que aparecen en un único nombre; compara palabras completas por su raíz
   (así "alta" no calza con "falta", pero "gluteo" sí con "gluteos"). */
const VACIAS = new Set(CONFIG.palabrasVacias || []);
function palabrasUnicas(claves, vacias = VACIAS){
  const uso = {};
  claves.forEach(k => new Set(norm(CAT[k].n).split(/[^a-z]+/).filter(w => w.length >= 4 && !vacias.has(w))).forEach(w => (uso[w] = uso[w] || []).push(k)));
  return Object.fromEntries(Object.entries(uso).filter(([,ks]) => ks.length === 1).map(([w,ks]) => [w, ks[0]]));
}
const PALABRAS = palabrasUnicas(Object.keys(CAT));
function buscarServicio(t, entre){
  // Entre opciones ya mostradas basta con que la palabra sea única entre ESAS opciones ("el de control acné", "el programa")
  const palabrasT = t.split(/[^a-z0-9]+/).filter(Boolean);
  const mapa = entre ? palabrasUnicas(entre, new Set(['para','con','sin'])) : PALABRAS;
  const puntos = {};
  Object.entries(mapa).forEach(([w,k]) => {
    const raiz = w.slice(0, Math.max(4, w.length-2));
    if (palabrasT.some(p => p.startsWith(raiz))) puntos[k] = (puntos[k]||0) + 1;
  });
  const orden = Object.entries(puntos).sort((a,b) => b[1]-a[1]);
  return orden.length ? orden[0][0] : null;
}

/* ----- Agenda simulada (misma fórmula que la IA en n8n: algunas horas "ocupadas" fijas por fecha) ----- */
const AG = R.agenda;
const AG_DIAS = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const AG_DIAS_TXT = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const AG_MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtH = h => (h % 12 || 12)+':00 '+(h < 12 ? 'a. m.' : 'p. m.');
function ahoraLocal(){ const d = new Date(Date.now() + AG.utcOffset*3600e3); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), dd:d.getUTCDate(), h:d.getUTCHours(), wd:d.getUTCDay()}; }
function agenda(){
  const a = ahoraLocal(), out = [];
  for (let i = 0; out.length < AG.dias && i < AG.dias*2 + 7; i++) {
    const f = new Date(Date.UTC(a.y, a.m, a.dd + i)), wd = f.getUTCDay();
    if (AG.cerrados.includes(wd)) continue;
    const ordinal = Math.round((f - Date.UTC(f.getUTCFullYear(), 0, 1)) / 864e5) + 1;
    const libres = AG.horas.filter(h => ((ordinal*7 + h*3) % 5) !== 0 && (i > 0 || h > a.h + 1));
    if (libres.length) out.push({i, wd, dd:f.getUTCDate(), etiqueta:AG_DIAS_TXT[wd]+' '+f.getUTCDate()+' de '+AG_MESES[f.getUTCMonth()], libres});
  }
  return out;
}
// ¿Qué día pidió? → {dia} | {cerrado:true} | {lleno:true} | null
function pedidoDia(t, ag){
  const a = ahoraLocal();
  const porOffset = n => { const d = ag.find(x => x.i === n); return d ? {dia:d} : (AG.cerrados.includes((a.wd + n) % 7) ? {cerrado:true} : {lleno:true}); };
  if (/\bpasado manana\b/.test(t)) return porOffset(2);
  if (/\bhoy\b/.test(t)) return porOffset(0);
  if (/\bmanana\b/.test(t) && !/\b(la|de la|por la) manana\b/.test(t)) return porOffset(1);
  for (let wd = 0; wd < 7; wd++) if (new RegExp('\\b'+AG_DIAS[wd]+'\\b').test(t)) {
    if (AG.cerrados.includes(wd)) return {cerrado:true};
    const d = ag.find(x => x.wd === wd);
    return d ? {dia:d} : {lleno:true};
  }
  const n = t.match(/\b(?:el|para el|dia)\s+(\d{1,2})\b(?!\s*(?:am|pm|a\.|p\.|:))|\b(\d{1,2}) de (?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/);
  if (n) { const d = ag.find(x => x.dd === +(n[1] || n[2])); return d ? {dia:d} : {lleno:true}; }
  return null;
}
// ¿Qué hora o franja pidió? → {h, franja}   ("a las 4" = 4 p. m.; "en la mañana", "en la tarde", "en la noche")
function pedidoHora(t){
  const r = {};
  if (/\b(la|de la|por la|en la) manana\b|temprano/.test(t)) r.franja = 'am';
  if (/\btarde\b/.test(t)) r.franja = 'pm';
  if (/\bnoche\b/.test(t)) r.franja = 'noche';
  const m = t.match(/\b(?:a las|las|a la|tipo|como a las|sobre las|tipo las)\s*(\d{1,2})(?::\d{2})?\s*(am|a\.?\s?m\.?|pm|p\.?\s?m\.?)?/) || t.match(/\b(\d{1,2})(?::\d{2})?\s*(am|a\.\s?m\.?|pm|p\.\s?m\.?)/);
  if (m) {
    let h = +m[1]; const suf = (m[2] || '').replace(/[\s.]/g,'');
    if (suf.startsWith('p') && h < 12) h += 12;
    else if (!suf && (r.franja === 'pm' || r.franja === 'noche') && h < 12) h += 12;
    else if (!suf && h < 8) h += 12;
    r.h = h;
  }
  return r;
}
function horasDelDia(dia, ph){
  let hs = dia.libres.slice();
  if (ph.franja === 'am') hs = hs.filter(h => h < 12);
  if (ph.franja === 'pm') hs = hs.filter(h => h >= 13);
  if (ph.franja === 'noche') hs = hs.filter(h => h >= 17);
  if (ph.h) hs.sort((x,y) => Math.abs(x-ph.h) - Math.abs(y-ph.h));
  return hs.slice(0, 4).sort((x,y) => x-y);
}
function ofrecer(slots, intro){
  ctx.reservando = true; ctx.slots = slots;
  const e = CAT[ctx.sugerida];
  const dur = e.sesiones || (e.d ? e.d+' min' : '');
  // Aviso del anticipo: una sola vez por servicio, cuando el cliente muestra interés (nunca en servicios gratis)
  let aviso = '';
  if (e.abono && ctx.abonoAvisado !== ctx.sugerida) { aviso = '\n\nPara apartar tu '+R.unidad+' se abonan *'+$$(e.abono)+'*, que se descuentan del total.'; ctx.abonoAvisado = ctx.sugerida; }
  else if (R.abono && e.p > 0 && ctx.abonoAvisado !== ctx.sugerida) { aviso = '\n\nPara apartar tu '+R.unidad+' se abona el '+Math.round(R.abono*100)+'% (*'+$$(Math.round(e.p*R.abono))+'*) y el resto se paga el día del servicio.'; ctx.abonoAvisado = ctx.sugerida; }
  // Si el intro ya termina en ":" ("…pero ese día tengo:"), la lista va directo, sin repetir "tengo estos horarios"
  return {r:(intro && intro.trim().endsWith(':') ? intro+'\n\n' : (intro ? intro+'\n\n' : '¡Perfecto! ')+'Para *'+e.n+'*'+(dur ? ' ('+dur+')' : '')+' tengo estos horarios:\n\n')+slots.map(s => '• '+s.dia.etiqueta+' · '+fmtH(s.h)).join('\n')+aviso+'\n\n¿Cuál prefieres?',
    chips: slots.map(s => s.dia.etiqueta+' · '+fmtH(s.h)), aviso:'La IA consulta en vivo la disponibilidad de tu agenda actual.'};
}
function ofrecerDia(dia, ph, intro){
  const hs = horasDelDia(dia, ph);
  if (!hs.length) return ofrecerDia(dia, {}, 'En esa franja ya no me quedan horarios el '+dia.etiqueta+', pero ese día tengo:');
  return ofrecer(hs.map(h => ({dia, h})), intro);
}
function iniciarReserva(t){
  ctx.sugerida = ctx.sugerida || Object.keys(CAT).find(x => CAT[x].p===0) || Object.keys(CAT)[0];
  const ag = agenda(), pd = t ? pedidoDia(t, ag) : null, ph = t ? pedidoHora(t) : {};
  const cercanos = () => ag.slice(0,3).map((d,j) => ({dia:d, h:d.libres[Math.min(j*2, d.libres.length-1)]}));
  if (pd && pd.cerrado) return ofrecer(cercanos(), 'Ese día no abrimos.');
  if (pd && pd.lleno) return ofrecer(cercanos(), 'Ese día ya no tengo horarios disponibles.');
  if (pd && pd.dia) {
    if (ph.h && pd.dia.libres.includes(ph.h)) return confirmar(pd.dia, ph.h);
    return ofrecerDia(pd.dia, ph, ph.h ? 'A las '+fmtH(ph.h)+' ya está ocupado el '+pd.dia.etiqueta+', pero ese día tengo:' : '');
  }
  return ofrecer(cercanos());
}
// Mientras elige horario. Devuelve null si el mensaje no trata de horarios (así siguen las demás reglas).
function reservarHora(t){
  const slots = ctx.slots || [];
  const exacto = slots.find(s => norm(s.dia.etiqueta+' · '+fmtH(s.h)) === t);
  if (exacto) return confirmar(exacto.dia, exacto.h);
  const idx = /^\s*([1-4])\s*$/.test(t) ? +t.trim()-1 : /primer/.test(t) ? 0 : /segund/.test(t) ? 1 : /tercer/.test(t) ? 2 : /cuart/.test(t) ? 3 : -1;
  if (idx >= 0 && slots[idx]) return confirmar(slots[idx].dia, slots[idx].h);
  const ag = agenda(), pd = pedidoDia(t, ag), ph = pedidoHora(t);
  if (pd) return iniciarReserva(t);
  const dias = [...new Set(slots.map(s => s.dia.etiqueta))].map(et => ag.find(d => d.etiqueta === et)).filter(Boolean);
  if (ph.h) {
    const d = dias.find(x => x.libres.includes(ph.h));
    if (d) return confirmar(d, ph.h);
    if (dias.length === 1) return ofrecerDia(dias[0], ph, 'A las '+fmtH(ph.h)+' ya está ocupado ese día; te puedo ofrecer:');
    return iniciarReserva(t);
  }
  if (ph.franja && dias.length) return ofrecerDia(dias[0], ph, '');
  return null;
}
// Gratis: sin política de cancelación. Con abono: abono + política en una línea. El recordatorio siempre se informa.
function confirmar(dia, h){
  const e = CAT[ctx.sugerida]; ctx.reservando = false; ctx.slots = null;
  // CONFIG.reserva.pedirNombre: antes de agendar pide el nombre, para que la hora quede a nombre de la persona (como el asistente real)
  if (R.pedirNombre && !ctx.nombre) {
    ctx.pendiente = {dia, h, serv:ctx.sugerida};   // guarda el servicio: si pregunta por otro antes de dar su nombre, se agenda el elegido
    return {r: typeof R.pedirNombre === 'string' ? R.pedirNombre : '¡Perfecto! ¿A nombre de quién dejo la '+R.unidad+'?', aviso:'Antes de agendar, el asistente pide el nombre: así la '+R.unidad+' queda registrada a nombre de la persona en tu calendario.'};
  }
  const op = dia.etiqueta+' · '+fmtH(h);
  const quien = ctx.nombre ? ', '+ctx.nombre.split(' ')[0] : '', aNombre = ctx.nombre ? '\n🙋 A nombre de *'+ctx.nombre+'*' : '';
  if (!e.abono && (!R.abono || !e.p)) return {r:'¡Listo'+quien+'! Tu hora para *'+e.n+'* quedó agendada para el *'+op+'*'+aNombre+'\n\n📍 '+R.direccion+'\n\nUn día antes te llegará un recordatorio por aquí. '+R.cierre, aviso:'La reserva entra a tu agenda a nombre de la persona y se programan los recordatorios (flujo 03).'};
  // Abono fijo por servicio (catalogo.x.abono) o porcentaje general (reserva.abono)
  const ab = e.abono || Math.round(e.p*R.abono);
  return {r:'¡Tu '+R.unidad+' quedó '+(R.femenino ? 'apartada' : 'apartado')+quien+'! ✨\n\n*'+e.n+'*\n🗓 '+op+aNombre+'\n💰 Valor: '+$$(e.p)+'\n💳 Abono para confirmar'+(e.abono ? ' (se descuenta del total)' : ' ('+Math.round(R.abono*100)+'%)')+': *'+$$(ab)+'*\n\nPuedes pagarlo por '+R.medios+' y enviarme aquí la foto del comprobante; se lo paso a '+CONFIG.marca.duena+' para que lo confirme.'+(R.politica ? '\n\n'+R.politica : '')+' Un día antes te llegará un recordatorio.', chips:['📎 Enviar comprobante'], abono:ab, aviso:'El horario queda bloqueado mientras se paga el abono.'};
}
async function validarComprobante(monto, t){

// "Soy la Coni", "a nombre de Daniela Rojas", "fran" → "Coni", "Daniela Rojas", "Fran". Una pregunta o un texto largo no es un nombre.
function leerNombre(txt){
  if (/[?¿\d@]/.test(txt)) return null;
  let s = txt.trim().replace(/[.!,;]+$/g, '').replace(/^(hola|buenas|ok|dale|si|sí)[,!\s]+/i, '');
  s = s.replace(/^(a nombre de|mi nombre es|me llamo|soy|es|de|para)\s+/i, '').replace(/^(la|el)\s+/i, '');
  const p = s.split(/\s+/).filter(Boolean);
  if (!p.length || p.length > 3 || !p.every(w => /^[\p{L}'-]{2,}$/u.test(w))) return null;
  if (/^(si|sii|no|ok|dale|ya|listo|gracias|hola|perfecto|bueno|cancelar|otro|otra|cambiar|ninguno|ninguna)$/.test(norm(p[0]))) return null;
  return p.map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}
function cerebro(txt){
  if (TI) return cerebroTienda(txt);                               // modo tienda: prenda → talla → color → pago
  if (CO) return cerebroCotizador(txt);                            // modo cotizador: tipo → fecha → invitados → paquete → cotización
  const t = norm(txt);
  const crudo = txt.toLowerCase();
  const regla = r => (r.si && r.si.some(p => t.includes(p))) || (r.igual && r.igual === t) || (r.re && r.re.test(t)) || (r.original && r.original.some(p => crudo.includes(p)));
  const primeras = CONFIG.reglas.filter(r => r.derivar);
  for (const r of primeras) if (regla(r)) return r;               // derivaciones siempre primero
  if (ctx.pendiente) {                                             // respondió a "¿a nombre de quién?" (CONFIG.reserva.pedirNombre)
    const nom = leerNombre(txt);
    if (nom) { ctx.nombre = nom; const p = ctx.pendiente; ctx.pendiente = null; ctx.sugerida = p.serv; return confirmar(p.dia, p.h); }
    if (/^(si|sii|ok|dale|listo|claro|perfecto|ya)\b/.test(t)) return {r:'¡Genial! ¿A nombre de quién dejo la '+R.unidad+'? Con tu nombre basta 😊'};
  }
  if (ctx.opciones) {                                              // elige una de las opciones recién recomendadas
    const elegida = buscarServicio(t, ctx.opciones);
    if (elegida) { ctx.sugerida = elegida; ctx.opciones = null; return iniciarReserva(t); }
    if (/^(si|sii|dale|claro|me gustaria|de una|ok)\b/.test(t)) return {r:'¡Genial! ¿Cuál de ellas te gustaría agendar?', chips: ctx.opciones.map(k => CAT[k].n)};
  }
  if (/agendar|reservar|apartar|separar/.test(t)) {                // nombra un servicio y quiere agendarlo
    const directo = buscarServicio(t);
    if (directo) { ctx.sugerida = directo; ctx.opciones = null; return iniciarReserva(t); }
  }
  if (ctx.reservando) { const rh = reservarHora(t); if (rh) return rh; }
  // Pide un día u hora ("¿tienes el martes?", "mañana en la tarde"): con servicio ya elegido, o nombrándolo en la misma frase
  const diaPedido = pedidoDia(t, agenda());
  if (diaPedido || pedidoHora(t).h) {
    const nombrado = buscarServicio(t);
    if (nombrado) { ctx.sugerida = nombrado; ctx.opciones = null; return iniciarReserva(t); }
    if (ctx.sugerida && !/precio|cuanto|que incluye/.test(t)) return iniciarReserva(t);
  }
  if (ctx.sugerida && /^(si|sii|dale|claro|por favor|me gustaria|de una|listo|ok)\b/.test(t)) return iniciarReserva(t);
  for (const r of CONFIG.reglas) {
    if (r.derivar || !regla(r)) continue;
    if (r.accion === 'reservar') return iniciarReserva(t);
    if (r.consultar) return {r:(r.r ? r.r+' ' : '')+CONFIG.consultar, aviso:r.aviso || 'Cuando la IA no tiene un dato, no inventa: se lo pregunta al dueño, y con su respuesta la próxima vez ya lo sabe.'};
    if (r.recomendar) return {...r, r: recomendar(typeof r.recomendar === 'function' ? r.recomendar(t) : r.recomendar, r.intro)};
    return r;
  }
  const porNombre = buscarServicio(t);                              // nombra un servicio del catálogo
  if (porNombre) return {r: recomendar([porNombre], '')};
  if (diaPedido) return iniciarReserva(t);                          // "¿tienen para el sábado?" sin servicio elegido
  if (CONFIG.saludo.si.some(p => t.includes(p))) return {...CONFIG.saludo, saludo:true};
  return CONFIG.sinEntender;
}

/* ----- Modo tienda (CONFIG.tienda) -----
   En vez de agenda: la prenda se muestra con foto (ficha), se pide talla y color (solo los que existen),
   se arma el pedido y se cierra con link de pago o contraentrega. La guía de tallas recomienda por medidas.
   Catálogo: {n, p, img, tallas:'S/M/L', colores:'Negro/Blanco', desc}. Reglas: accion 'guia' | 'comprar' | 'precio';
   final:true = se evalúa después de reconocer la prenda por su nombre (comprar, catálogo, precio, gracias). */
const TI = CONFIG.tienda || null;
const lista = s => s ? String(s).split('/').map(x => x.trim()).filter(Boolean) : [];
const SI = /^(si|sii|dale|claro|de una|listo|ok|okay|perfecto|me encanta|me gusta|la quiero|lo quiero|aparta|separa)\b/;
const tipoPrenda = e => /\d/.test(e.tallas || '') ? 'abajo' : 'arriba';
function coincide(r, t, crudo){ return (r.si && r.si.some(p => t.includes(p))) || (r.igual && r.igual === t) || (r.re && r.re.test(t)) || (r.original && r.original.some(p => crudo.includes(p))); }
function tallaEn(t, k){
  const toks = t.split(/[^a-z0-9]+/).filter(Boolean);
  return lista(CAT[k].tallas).sort((a,b) => b.length-a.length).find(x => toks.includes(norm(x))) || null;
}
function colorEn(t, k){ return lista(CAT[k].colores).sort((a,b) => b.length-a.length).find(c => t.includes(norm(c))) || null; }
function medidasEn(t){ return (t.match(/\b\d{2,3}\b/g) || []).map(Number).filter(n => n >= 60 && n <= 150); }
const totalPedido = () => ctx.carrito.reduce((s,i) => s + CAT[i.k].p, 0);
const lineaPedido = i => '🛍 *'+CAT[i.k].n+'*'+(i.talla ? ' · talla '+i.talla : '')+(i.color ? ' · '+i.color : '')+' · '+$$(CAT[i.k].p);
function preguntaTalla(e){

  const c = ctx.cot, T = CO.textos, pre = intro ? intro+'\n\n' : '';
  if (!c.tipo) { c.paso = 'tipo'; return {r:pre+T.preguntaTipo, chips:CO.tipos.map(x => x.chip || x.n)}; }
  if (!c.fecha && c.mes) { c.paso = 'fecha'; const o = opcionesMes(); return {...o, r:pre+o.r}; }   // ya dijo el mes: no se vuelve a preguntar desde cero
  if (!c.fecha) { c.paso = 'fecha'; c.ofrecidas = proximasLibres(75, 3); return {r:pre+T.preguntaFecha(tipoActual()), chips:c.ofrecidas.map(f => cap(fechaLarga(f))).concat([T.chipSinFecha])}; }
  if (!c.inv) { c.paso = 'invitados'; return {r:pre+T.preguntaInvitados, chips:T.chipsInvitados}; }
  if (!c.paq) { c.paso = 'paquete'; return {r:pre+opcionesPaquetes(), r2:T.cierrePaquetes, chips:Object.values(CO.paquetes).map(p => p.n), aviso:T.avisoPaquetes}; }
  return cotizar(pre);
}
function cotizar(pre){
  const c = ctx.cot, T = CO.textos, p = CO.paquetes[c.paq], pp = precioPP(p), n = facturados();
  const items = [['Paquete '+p.n, n+' invitados × '+$$(pp), pp*n]];
  c.extras.forEach(k => { const e = CO.extras[k]; items.push([e.n, e.pp ? n+' × '+$$(e.pp) : (e.det || 'Adicional'), e.pp ? e.pp*n : e.p]); });
  const total = items.reduce((s,i) => s + i[2], 0), num = (CO.prefijo || '')+(ctx.nCot++);
  c.listo = true; c.paso = 'despues'; c.total = total;
  return {r:pre+T.antesDeCotizacion, pedido:{titulo:'Cotización '+num+' · '+tipoActual().n, items, total, pie:etiquetaFecha(c)+' · '+T.pieCotizacion},
    doc:[T.nombrePdf(num), T.detallePdf], r2:T.queSigue, chips:CO.chipsDespues, aviso:T.avisoCotizacion};
}
function separarFecha(){
  const c = ctx.cot, T = CO.textos;
  if (!c.listo) return continuarCot(T.separarPrimero);
  if (!fechaDe(c)) { c.fecha = null; c.paso = 'fecha'; return {r:T.separarSinFecha, chips:proximasLibres(75, 3).map(f => cap(fechaLarga(f)))}; }
  return {r:T.separar(fechaLarga(c.fecha), $$(CO.separacion)), chips:['📎 Enviar comprobante'], abono:CO.separacion, aviso:T.avisoSeparar};
}
// Lee del mensaje todo dato del evento (en cualquier orden). Devuelve una respuesta o null si no había datos.
function leerDatos(t){
  const c = ctx.cot, T = CO.textos, notas = [];
  let cambio = false, problema = null;
  if (/\b(no (lo )?se|todavia no|aun no|no tenemos|no tengo|sin fecha|por definir|no hemos)\b/.test(t)) {
    if (c.paso === 'fecha') { c.fecha = 'pendiente'; return continuarCot(T.sinFecha); }
    if (c.paso === 'invitados') return {r:T.invAprox, chips:T.chipsInvitados};
  }
  const tipo = CO.tipos.find(x => coincide(x, t, t));
  if (tipo && tipo.k !== c.tipo) { const antes = c.tipo; c.tipo = tipo.k; cambio = true; if (!antes && tipo.wow) notas.push(tipo.wow); }
  const lf = leerFecha(t, c.paso === 'fecha');
  if (lf) {
    cambio = true;
    if (lf.pasada || lf.invalida) problema = {r:lf.invalida ? (T.fechaInvalida || T.fechaPasada) : T.fechaPasada};
    else if (lf.mes !== undefined) { c.mes = {mes:lf.mes, y:lf.y}; c.paso = 'fecha'; problema = opcionesMes(); }
    else if (lf.varias) {
      c.ofrecidas = lf.varias; c.paso = 'fecha';
      problema = {r:T.cualDeEstas+'\n\n'+lf.varias.map(f => '• '+cap(fechaLarga(f))).join('\n'), chips:lf.varias.map(f => cap(fechaLarga(f)))};
    }
    else if (ocupada(lf.fecha)) {
      const alt = cercanas(lf.fecha, 3); c.paso = 'fecha'; c.ofrecidas = alt;
      problema = {r:(cerradaFija(lf.fecha) ? (T.fechaCerrada || T.fechaOcupada)(fechaLarga(lf.fecha)) : T.fechaOcupada(fechaLarga(lf.fecha)))+'\n\n'+alt.map(f => '• '+cap(fechaLarga(f))).join('\n')+'\n\n'+T.cualFecha, chips:alt.map(f => cap(fechaLarga(f))), aviso:T.avisoOcupada};
    }
    else { const antes = c.fecha; c.fecha = lf.fecha; c.ofrecidas = null; if (!c.listo || +antes !== +c.fecha) notas.push(T.fechaLibre(fechaLarga(lf.fecha))); }
  }
  const inv = leerInvitados(t, lf && lf.txt, c.paso === 'invitados');
  if (inv) {
    cambio = true;
    if (inv > CO.maximo) { c.inv = null; c.paso = 'invitados'; problema = problema || {r:T.muchos(inv), chips:T.chipsInvitados}; }
    else { const antes = c.inv; c.inv = inv; if (inv < CO.minimo) notas.push(T.pocos(inv)); else if (antes !== inv && !c.listo && !(c.tipo && c.fecha)) notas.push('Anotado: *'+inv+' invitados* ✓'); }
  }
  const pq = leerPaquete(t, c.paso === 'paquete');
  if (pq && pq !== c.paq) { c.paq = pq; cambio = true; if (!c.listo && c.paso !== 'paquete') notas.push('*'+CO.paquetes[pq].n+'* · '+$$(CO.paquetes[pq].pp)+' por persona\nIncluye '+CO.paquetes[pq].inc+'.'); }
  let ex = leerExtra(t);
  if (!ex && c.extraPend && /agreg|suma|anad|incluy|\bsi\b|dale/.test(t)) ex = c.extraPend;
  if (ex) {
    const e = CO.extras[ex];
    if (c.paso === 'extras' || ex === c.extraPend || /agreg|suma|anad|incluy|quiero|ponle|con /.test(t)) {
      if (!c.extras.includes(ex)) c.extras.push(ex);
      c.extraPend = null; cambio = true; notas.push('Anotado: *'+e.n+'* ✓');
    } else if (!cambio) {
      c.extraPend = ex;
      return {r:'*'+e.n+'* · '+precioExtra(e)+(e.inc ? '\n'+e.inc : ''), chips:[T.chipAgregarExtra, 'Ver los paquetes'], aviso:T.avisoExtras};
    }
  }
  if (!cambio) return null;
  if (problema) return {...problema, r:(notas.length ? notas.join('\n\n')+'\n\n' : '')+problema.r};
  return continuarCot(notas.join('\n\n'));
}
function aplicarCot(r, t){
  const c = ctx.cot, T = CO.textos;
  if (r.accion === 'cotizar') return c.listo ? {r:T.yaCotizado, chips:CO.chipsDespues} : continuarCot(r.r);
  if (r.accion === 'fecha') { if (c.listo) return {r:T.yaCotizado, chips:CO.chipsDespues}; c.paso = 'fecha'; return {r:(r.r ? r.r+'\n\n' : '')+T.preguntaFecha(tipoActual()), chips:proximasLibres(75, 3).map(f => cap(fechaLarga(f)))}; }
  if (r.accion === 'paquetes') return {r:opcionesPaquetes(), r2:c.listo ? T.cambiarPaquete : T.cierrePaquetes, chips:Object.values(CO.paquetes).map(p => p.n), aviso:T.avisoPaquetes};
  if (r.accion === 'visita') { ctx.sugerida = CO.visita; ctx.opciones = null; return iniciarReserva(t); }
  if (r.accion === 'separar') return separarFecha();
  if (r.accion === 'extras') { c.paso = 'extras'; return {r:T.listaExtras+'\n\n'+Object.values(CO.extras).map(e => '• *'+e.n+'* · '+precioExtra(e)).join('\n'), chips:Object.values(CO.extras).map(e => e.n), aviso:T.avisoExtras}; }
  const base = r.consultar ? {r:(r.r ? r.r+' ' : '')+CONFIG.consultar, aviso:r.aviso || 'Cuando la IA no tiene un dato, no inventa: se lo pregunta al equipo, y con su respuesta la próxima vez ya lo sabe.'} : r;
  // Si la cotización va a medias, después de responder el tema se retoma la pregunta pendiente
  if (!c.listo && (c.tipo || c.fecha || c.inv) && !r.final) { const sig = continuarCot(); return {...base, r2:sig.r, chips:sig.chips}; }
  return base;
}
function cerebroCotizador(txt){
  const t = norm(txt), crudo = txt.toLowerCase();
  for (const r of CONFIG.reglas) if (r.derivar && coincide(r, t, crudo)) return r;
  if (t.split(/\s+/).length <= 3 && CONFIG.saludo.si.some(p => t.startsWith(p))) return {...CONFIG.saludo, saludo:true};
  if (ctx.reservando) { const rh = reservarHora(t); if (rh) return rh; }
  const datos = leerDatos(t); if (datos) return datos;
  for (const r of CONFIG.reglas) if (!r.derivar && !r.final && coincide(r, t, crudo)) return aplicarCot(r, t);
  if (SI.test(t)) return ctx.cot.listo ? {r:CO.textos.queSigue, chips:CO.chipsDespues} : continuarCot();
  for (const r of CONFIG.reglas) if (r.final && coincide(r, t, crudo)) return aplicarCot(r, t);
  if (CONFIG.saludo.si.some(p => t.includes(p))) return {...CONFIG.saludo, saludo:true};
  return CONFIG.sinEntender;
}

/* Piezas de tienda para las escenas: ficha de prenda, resumen de pedido, documento (PDF) y foto */
const imgUrl = (src, w) => src ? src + (src.includes('?') ? '&' : '?') + 'width=' + (w || 360) : '';
function fichaHtml(k){
  const e = CAT[k];
  return '<div class="prod">'+(e.img ? '<img alt="'+esc(e.n)+'" src="'+esc(imgUrl(e.img))+'" onload="bajar()" onerror="this.style.visibility=\'hidden\'">' : '<div class="ph">'+esc(e.n)+'</div>')+
    '<div class="i"><b>'+esc(e.n)+'</b><span class="p">'+$$(e.p)+'</span>'+
    (lista(e.tallas).length > 1 ? '<span>Tallas '+esc(lista(e.tallas).join(' · '))+'</span>' : '')+
    (lista(e.colores).length > 1 ? '<span>'+esc(lista(e.colores).slice(0,4).join(' · '))+(lista(e.colores).length > 4 ? ' +'+(lista(e.colores).length-4) : '')+'</span>' : '')+'</div></div>';
}
function productos(claves){ return nodo(claves.map(fichaHtml).join(''), 'prods'+(claves.length === 1 ? ' una' : '')); }
function pedido({titulo='Tu pedido', items=[], total, pie}){
  const tot = total ?? items.reduce((s,i) => s + i[2], 0);
  return nodo('<div class="tit">'+esc(titulo)+'</div>'+items.map(i => '<div class="l"><span>'+esc(i[0])+'<small>'+esc(i[1] || '')+'</small></span><span>'+$$(i[2])+'</span></div>').join('')+
    '<div class="tot"><span>Total</span><span>'+$$(tot)+'</span></div>'+(pie ? '<div class="pie">'+fmt(pie)+'</div>' : '')+'<span class="h">'+hhmm()+'</span>', 'msg in pedido');
}
function documento(nombre, detalle, lado='in'){
  return nodo('<span class="ic">PDF</span><span class="tx"><b>'+esc(nombre)+'</b><small>'+esc(detalle || '')+'</small></span><span class="h">'+hhmm()+'</span>', 'msg '+lado+' doc');
}
function foto(src, lado='out', caption=''){
  return nodo('<img alt="" src="'+esc(src)+'" onload="bajar()" onerror="this.style.visibility=\'hidden\'">'+(caption ? '<span class="cap">'+fmt(caption)+'</span>' : '')+'<span class="h">'+hhmm()+'</span>', 'msg '+lado+' foto');
}

let enLibre = false;
let iaCaida = false;
let sesion = 'demo-' + Math.random().toString(36).slice(2,10);
let estadoIA = null;
async function enviarLibre(texto){
  if (!enLibre || !texto.trim()) return;
  const t = token;
  burbuja(texto, 'out'); input.value = ''; sugerencias([]);
  if (texto.startsWith('📎')) {
    const m = ctx.abono || 50000; ctx.abono = null;
    try { await validarComprobante(m, t); detras('La IA lee el comprobante (monto, fecha, cuenta de destino) y lo cruza con la reserva y el aviso del banco. Si coincide, confirma sola; si no, avisa a una persona. Flujo 02.'); } catch(e){}
    return;
  }
  let res = null;
  if (CONFIG.asistenteUrl && !iaCaida) {
    // IA real (n8n) → {respuesta, chips, abono, derivar}. Si tarda >25 s o falla, responde el asistente local
    // y no se vuelve a intentar en esta visita. Ver references/asistente-ia-n8n.md.
    const ty = nodo('<i></i><i></i><i></i>', 'typing');
    const corte = new AbortController(); const reloj = setTimeout(() => corte.abort(), 45000);
    try {
      const resp = await fetch(CONFIG.asistenteUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({sessionId:sesion, mensaje:texto, negocio:NEGOCIO, estado:estadoIA}), signal:corte.signal});
      const j = resp.ok ? await resp.json() : null;
      if (j && j.respuesta) res = j;
    } catch(e) { /* sin conexión: asistente local */ }
    clearTimeout(reloj); ty.remove();
    if (t!==token) return;
    if (res) {
      burbuja(res.respuesta, 'in'); if (res.estado) estadoIA = res.estado;
      ctx.primera = false;
      if (res.abono) ctx.abono = res.abono;
      if (Array.isArray(res.chips) && res.chips.length) sugerencias(res.chips);
      detras(res.derivar
        ? 'La IA pausa este chat y le avisa a '+M.duena+'. No diagnostica ni inventa: lo que no sabe o es delicado, lo pasa a una persona.'
        : 'Respuesta generada en vivo por la IA, con tus servicios y tus precios. Es el mismo asistente que atiende a los clientes de verdad: aquí la agenda es de ejemplo.');
      return;
    }
    iaCaida = true;
  }
  ctx.chips = null;
  res = cerebro(texto);
  // Si el primer mensaje no es un saludo, se saluda y se responde en el mismo mensaje
  const texto1 = (ctx.primera && !res.saludo) ? CONFIG.bienvenidaCorta+'\n\n'+res.r : res.r;
  ctx.primera = false;
  try {
    await escribe(texto1, t);
    if (res.productos) { productos(res.productos); await esperar(450, t); }   // modo tienda: fichas con foto
    if (res.fotos) for (const f of res.fotos) { foto(f, 'in'); await esperar(350, t); }
    if (res.pedido) { pedido(res.pedido); await esperar(450, t); }           // modo cotizador: tarjeta de cotización
    if (res.doc) documento(res.doc[0], res.doc[1]);
    if (res.r2) await escribe(res.r2, t, 650);
    if (res.abono) ctx.abono = res.abono;
    if (res.set) { ctx.sugerida = res.set; ctx.opciones = null; }
    if (res.chips || ctx.chips) sugerencias(res.chips || ctx.chips);
    if (res.aviso) detras(res.aviso);
  } catch(e){}
}
document.getElementById('entrada').addEventListener('submit', e => { e.preventDefault(); enviarLibre(input.value); });

async function iniciarAsistente(t){
  cabecera({}); libre(true); enLibre = true; sesion = 'demo-' + Math.random().toString(36).slice(2,10); iaCaida = false; estadoIA = null;
  ctx = nuevoCtx();
  dia('HOY');
  sistema(CONFIG.invitacion);                    // el negocio NUNCA escribe primero
  sugerencias(CONFIG.chipsIniciales || []);
}

const nav = document.getElementById('momentos');
let actual = 0;
MOMENTOS.forEach((m, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'momento';
  b.innerHTML = '<span class="n">'+(i+1)+'</span><span><h3>'+esc(m.t)+'</h3><p>'+esc(m.s)+'</p><span class="tag">'+esc(m.tag)+'</span></span>';
  b.onclick = () => abrir(i, true);
  nav.appendChild(b);
});
function abrir(i, desdeClick){
  actual = i; token++;
  const t = token;
  enLibre = false; libre(false);
  limpiar(); hora = MOMENTOS[i].hora ?? 9*60;
  [...nav.children].forEach((b,j) => b.classList.toggle('on', j===i));
  if (desdeClick && window.innerWidth <= 920) document.querySelector('.phone').scrollIntoView({behavior:'smooth', block:'start'});
  detras(MOMENTOS[i].detras);
  Promise.resolve(MOMENTOS[i].run(t)).catch(e => { if (!(e instanceof Cortado)) console.error(e); });
}
document.getElementById('repetir').onclick = () => abrir(actual, false);
abrir(0, false);
(() => {
  if (window.parent === window) return;
  let ultimo = 0;
  const avisar = () => { const alto = Math.ceil(document.querySelector('.stage').getBoundingClientRect().height); if (alto !== ultimo) { ultimo = alto; window.parent.postMessage({ tipo: 'aigx-demo-alto', alto }, location.origin); } };
  new ResizeObserver(avisar).observe(document.querySelector('.stage'));
  avisar();
})();
